[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bidforge-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]", "python-multipart", "pydantic>=2",
  "litellm", "tenacity", "asyncpg", "redis>=5", "numpy",
  "langgraph", "mcp", "arq", "docling",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F"]
