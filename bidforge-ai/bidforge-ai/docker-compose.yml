services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: bidforge }
    ports: ["5432:5432"]
    volumes: ["./migrations:/docker-entrypoint-initdb.d"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    command: uvicorn app.interface.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: .
    command: arq app.worker.WorkerSettings
    env_file: .env
    depends_on: [db, redis]
